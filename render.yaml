# ---------------------------------------------------------------------------
# Render Blueprint — AnaRisk backend (FastAPI) + managed PostgreSQL.
#
# Creates two resources from this repository:
#   1. anarisk-db    — Render Postgres (persistent, TLS required)
#   2. anarisk-api   — the FastAPI service (rootDir: backend)
#
# Migrations run automatically on every deploy via preDeployCommand
# (alembic upgrade head), and the health check hits /api/v1/ready, which
# verifies BOTH database connectivity and that the schema is at the expected
# revision — a deploy with a broken DATABASE_URL or missing migrations is
# reported as failed instead of "green but every request is a 500".
#
# Secrets are never stored in this file: variables marked `sync: false` are
# prompted for in the Render Dashboard when the Blueprint first syncs.
# See docs/DEPLOY_RENDER.md for the full environment-variable reference and
# the post-deploy verification checklist.
# ---------------------------------------------------------------------------

databases:
  - name: anarisk-db
    plan: free # 0.1 CPU / 256 MB. Upgrade to 0.1c-256mb+ (paid) for production workloads.
    databaseName: nimbus
    user: nimbus
    # ipAllowList omitted => all IPs allowed; connections still require valid
    # credentials and TLS (the app adds sslmode=require for *.render.com hosts).

services:
  - type: web
    name: anarisk-api
    runtime: python # pick Python 3.11–3.13 in the dashboard (3.11.16 is what the suite runs on)
    plan: free # 0.1 CPU / 512 MB; spins down when idle. Use 0.5c-512mb or bigger for production.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head # applied BEFORE the new version starts serving
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready # DB + migration readiness, not just process liveness
    autoDeployTrigger: commit
    envVars:
      # ---- runtime / security ----
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true # 256-bit value, generated once and kept across syncs.
        # Alternative: `sync: false` and paste your own: python -c "import secrets; print(secrets.token_urlsafe(48))"
      # ---- database (rendered from anarisk-db; includes sslmode) ----
      - key: DATABASE_URL
        fromDatabase:
          name: anarisk-db
          property: connectionString
      # ---- frontend origin (Vercel) — REQUIRED, prompt at first sync ----
      # e.g. https://your-project.vercel.app   (comma-separated for several origins)
      - key: CORS_ORIGINS
        sync: false
      # Base URL used in password-reset links; same as the Vercel origin.
      - key: FRONTEND_URL
        sync: false
      # ---- transactional email (OTP verification + password reset) ----
      # Switch to the `resend` provider in the dashboard if you use Resend instead
      # (see docs/EMAIL_SETUP.md). With EMAIL_PROVIDER=none in production the API
      # honestly reports that no email can be delivered (503 on password reset).
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false # must be a verified sender for the chosen provider
      - key: EMAIL_FROM_NAME
        value: AnaRisk
      # ---- AI assistant (optional; retrieval mode when provider=none) ----
      - key: AI_PROVIDER
        value: openai-compatible # set to `openai-compatible` and add AI_API_KEY + AI_MODEL in the dashboard to enable
      # ---- background monitoring scheduler (single instance) ----
      - key: MONITORING_WORKER_ENABLED
        value: "true"
      - key: MONITORING_INTERVAL_SECONDS
        value: "300"
      # ---- rate limiting ----
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # ---- public self-signup (first account registers through the UI) ----
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
    # Persistent storage for evidence/brand-reference uploads (UPLOAD_DIR):
    # Render disks require a paid instance plan. If you attach one, also set
    #   UPLOAD_DIR: /opt/render/project/src/backend/uploads
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 5
